      <title id="database-tables-title">Database tables</title>
      <desc id="database-tables-desc">The six Portal database tables: orders own their items and one saved solution, box types are referenced by text from solutions, and users and handling settings stand alone.</desc>
      <defs>
      <style>#database-tables-root { --color-paper: #0d1117; --color-ink: #e6edf3; --color-muted: #9da7b3; --color-accent: #58a6ff;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #database-tables-root { font-family: var(--font-sans); color: var(--color-ink); }
      #database-tables-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#database-tables-root .diagram-container { overflow-x: visible; }
}</style>
