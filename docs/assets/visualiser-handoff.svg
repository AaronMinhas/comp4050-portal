<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 812" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="visualiser-handoff-title visualiser-handoff-desc" id="visualiser-handoff-root">
      <title id="visualiser-handoff-title">FitVisualiser handoff</title>
      <desc id="visualiser-handoff-desc">The frontend requests a short-lived scoped link, opens FitVisualiser with it, and FitVisualiser fetches the saved solution from the Portal API, which returns it only if the token and solution digest are valid.</desc>
      <defs>
      <style>#visualiser-handoff-root { --color-paper: #0d1117; --color-ink: #e6edf3; --color-muted: #9da7b3; --color-accent: #58a6ff;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #visualiser-handoff-root { font-family: var(--font-sans); color: var(--color-ink); }
      #visualiser-handoff-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#visualiser-handoff-root .diagram-container { overflow-x: visible; }
}</style>
